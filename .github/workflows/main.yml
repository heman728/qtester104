name: Build QTester104 Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2
          
      - name: Build
        run: |
          qmake QTester104.pro
          nmake release
          
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: QTester104-Windows
          path: release/*.exe
