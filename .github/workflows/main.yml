name: Build QTester104 Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'
          arch: 'win64_msvc2019_64'
          modules: 'qtnetworkauth'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          qmake IEC104.pro CONFIG+=c++17
          nmake release

      - name: Find EXE
        run: |
          echo "=== Searching for EXE ==="
          Get-ChildItem -Recurse -Filter "*.exe"

      - name: Deploy Qt DLLs
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*.exe" | Select-Object -First 1
          echo "Found EXE at: $($exe.FullName)"
          windeployqt $exe.FullName
          echo "EXE Directory: $($exe.DirectoryName)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QTester104-Windows
          path: |
            **/*.exe
            **/release/*
          if-no-files-found: warn
