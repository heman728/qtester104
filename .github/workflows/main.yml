name: Build QTester104 Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'
          arch: 'win64_msvc2019_64'
          modules: 'qtnetworkauth'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          qmake IEC104.pro CONFIG+=c++17
          nmake release

      - name: Find EXE Location
        run: |
          echo "=== All EXE files found ==="
          Get-ChildItem -Recurse -Filter "*.exe" | ForEach-Object { echo $_.FullName }

      - name: Deploy Qt DLLs
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "*IEC*" -or $_.Name -like "*iec*" -or $_.Name -like "*tester*" } | Select-Object -First 1
          if ($exe) {
            echo "Found EXE: $($exe.FullName)"
            windeployqt $exe.FullName
            echo "EXEDIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
          } else {
            echo "No IEC exe found, searching all..."
            $exe = Get-ChildItem -Recurse -Filter "*.exe" | Select-Object -First 1
            echo "Using: $($exe.FullName)"
            windeployqt $exe.FullName
            echo "EXEDIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QTester104-Windows
          path: ${{ env.EXEDIR }}
          if-no-files-found: error
```

---

## What This Does Differently
```
1. Searches ALL folders for any .exe
2. Prints exact path in log
3. Deploys DLLs to correct folder
4. Uploads that exact folder
```

---

## After Running
```
Actions → Green tick
→ Bottom of page
→ Artifacts → QTester104-Windows
→ Download ZIP
→ Extract → Run IEC104.exe
